name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Format check (clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install clang-format 22.1.0
        run: pip install clang-format==22.1.0

      - name: Verify clang-format version
        run: clang-format --version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DIO_RIPPER_CORE_ENABLE_TESTS=OFF

      - name: Check formatting
        run: cmake --build build --target io_ripper_core_format_check

  build-and-test:
    name: Build & test (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j

      - name: Run tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  shared-build:
    name: Shared build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Shared builds validate the shared artifact (compilation, symbol
      # exports, linking). The test suite is exercised by the static build
      # matrix, so tests stay disabled here.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DIO_RIPPER_CORE_BUILD_SHARED=ON -DIO_RIPPER_CORE_ENABLE_TESTS=OFF

      - name: Build
        run: cmake --build build --config Debug -j

  install-consumer:
    name: Installed-package consumer (static + shared)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify install and external consumer
        run: ./scripts/verify_install.sh

  sanitizers:
    name: Sanitizers (ASan + UBSan, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    env:
      CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  clang-tidy:
    name: clang-tidy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install clang-tidy
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Add LLVM to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # shellcheck disable=SC2028,SC2086
          'C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_PATH -Append

      # Tests are excluded from static analysis by default
      # (IO_RIPPER_CORE_TIDY_INCLUDE_TESTS defaults to OFF); disabling the
      # test build here also skips the Catch2 dependency fetch.
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DIO_RIPPER_CORE_ENABLE_TESTS=OFF

      # Ninja is required on Windows to emit compile_commands.json, which the
      # clang-tidy target resolves via `-p <build dir>`.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DIO_RIPPER_CORE_ENABLE_TESTS=OFF

      - name: Run clang-tidy
        run: cmake --build build --config Debug --target io_ripper_core_tidy
